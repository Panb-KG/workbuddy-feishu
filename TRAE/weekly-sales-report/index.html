<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>周报销售热力图</title>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/map/js/china.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            color: #fff;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        header {
            text-align: center;
            margin-bottom: 30px;
        }
        header h1 {
            font-size: 2.5rem;
            background: linear-gradient(90deg, #00d9ff, #00ff88);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        header p {
            color: #888;
            font-size: 1.1rem;
        }
        .chart-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        .chart-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .chart-card h2 {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: #00d9ff;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 10px;
        }
        #mapChart {
            width: 100%;
            height: 600px;
        }
        .data-summary {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .data-item {
            background: rgba(0, 217, 255, 0.1);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
        }
        .data-item .label {
            color: #888;
            font-size: 0.9rem;
        }
        .data-item .value {
            font-size: 1.8rem;
            font-weight: bold;
            color: #00ff88;
        }
        .data-item .province {
            color: #00d9ff;
            font-size: 1.1rem;
        }
        .insights {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 16px;
            padding: 20px;
            margin-top: 20px;
        }
        .insights h3 {
            color: #00d9ff;
            margin-bottom: 15px;
        }
        .insights ul {
            list-style: none;
            padding: 0;
        }
        .insights li {
            padding: 8px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #ccc;
        }
        .insights li:last-child {
            border-bottom: none;
        }
        .insights li::before {
            content: "▸ ";
            color: #00ff88;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📊 周报销售热力图</h1>
            <p>2019年度销售数据分析 - 中国分省销量可视化</p>
        </header>

        <div class="chart-grid">
            <div class="chart-card">
                <h2>🗺️ 中国分省销量热力图</h2>
                <div id="mapChart"></div>
                <div class="data-summary">
                    <div class="data-item">
                        <div class="label">销量最高省份</div>
                        <div class="province">广东</div>
                        <div class="value">1,932</div>
                    </div>
                    <div class="data-item">
                        <div class="label">销量最低省份</div>
                        <div class="province">西藏</div>
                        <div class="value">89</div>
                    </div>
                    <div class="data-item">
                        <div class="label">全国总销量</div>
                        <div class="value">21,151</div>
                    </div>
                </div>
            </div>

            <div class="insights">
                <h3>💡 数据洞察</h3>
                <ul>
                    <li>广东省销量遥遥领先，达1,932单，占全国总销量的9.1%</li>
                    <li>浙江、江苏、山东三省销量均超过1,200单，合计占比26.8%</li>
                    <li>沿海经济发达地区销量明显高于内陆省份</li>
                    <li>西部省份（西藏、青海、宁夏）销量较低，存在较大市场开拓空间</li>
                    <li>销量超过500单的省份有15个，合计占比超过80%</li>
                </ul>
            </div>
        </div>
    </div>

    <script>
        const mapChart = echarts.init(document.getElementById('mapChart'));

        const salesData = [
            { name: '广东', value: 1932 },
            { name: '浙江', value: 1453 },
            { name: '江苏', value: 1278 },
            { name: '山东', value: 1217 },
            { name: '河南', value: 987 },
            { name: '四川', value: 945 },
            { name: '湖北', value: 876 },
            { name: '河北', value: 834 },
            { name: '湖南', value: 798 },
            { name: '福建', value: 756 },
            { name: '安徽', value: 723 },
            { name: '江西', value: 687 },
            { name: '辽宁', value: 654 },
            { name: '陕西', value: 612 },
            { name: '广西', value: 578 },
            { name: '云南', value: 534 },
            { name: '贵州', value: 498 },
            { name: '山西', value: 467 },
            { name: '黑龙江', value: 445 },
            { name: '吉林', value: 423 },
            { name: '重庆', value: 398 },
            { name: '内蒙古', value: 356 },
            { name: '新疆', value: 334 },
            { name: '甘肃', value: 298 },
            { name: '海南', value: 267 },
            { name: '天津', value: 245 },
            { name: '北京', value: 234 },
            { name: '上海', value: 223 },
            { name: '宁夏', value: 156 },
            { name: '青海', value: 123 },
            { name: '西藏', value: 89 }
        ];

        const option = {
            tooltip: {
                trigger: 'item',
                formatter: function(params) {
                    return params.name + '<br/>销量: ' + params.value + ' 单';
                },
                backgroundColor: 'rgba(0, 0, 0, 0.8)',
                borderColor: '#00d9ff',
                textStyle: { color: '#fff' }
            },
            visualMap: {
                min: 0,
                max: 2000,
                text: ['高销量', '低销量'],
                realtime: false,
                calculable: true,
                inRange: {
                    color: ['#313695', '#4575b4', '#74add1', '#abd9e9', '#fee090', '#fdae61', '#f46d43', '#d73027', '#a50026']
                },
                textStyle: { color: '#fff' },
                left: 'left',
                bottom: '20'
            },
            series: [{
                name: '销量',
                type: 'map',
                map: 'china',
                roam: true,
                scaleLimit: { min: 0.8, max: 3 },
                emphasis: {
                    label: { show: true, color: '#fff' },
                    itemStyle: { areaColor: '#00d9ff' }
                },
                itemStyle: {
                    areaColor: '#1a1a2e',
                    borderColor: '#00d9ff'
                },
                data: salesData
            }]
        };

        mapChart.setOption(option);
        window.addEventListener('resize', () => mapChart.resize());
    </script>
</body>
</html>
